<div fxLayout="column" class="{{ sectionTitle }}">
  <div mat-line *ngIf="list?.header">{{ list.header }}</div>
  <div mat-line *ngIf="list?.subheader" class="subheader">
    {{ list.subheader }}
  </div>
  <p mat-line *ngIf="list?.description">{{ list.description }}</p>
  <ul *ngIf="list?.bullets">
    <li *ngFor="let item of list?.bullets">{{ item }}</li>
  </ul>
</div>
